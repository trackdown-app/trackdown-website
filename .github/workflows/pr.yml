name: CI

on:
  pull_request:

# Every action is pinned to a commit SHA, with its release in a trailing
# comment, so a moved tag cannot change what runs. Dependabot
# (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CACHE_PATH: node_modules

# The jobs use only what is in this repository. The build needs no private
# data, so no job gets a token or secret for another repository.
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: key
        run: echo "key=node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun binary only; dependencies come from the cache below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: bun run typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun binary only; dependencies come from the cache below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: bun run lint

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun binary only; dependencies come from the cache below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: bun run test

  # Fails when `openapi/v1.json` is not what the shared schemas generate, so
  # the iOS app's client never builds from a stale spec
  # (docs/api.md#the-openapi-document).
  openapi:
    name: OpenAPI
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun binary only; dependencies come from the cache below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: bun run openapi:check

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun binary only; dependencies come from the cache below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      # Builds with the committed fixture as the game data, then fails when
      # any of it reaches the static output (docs/data.md#the-build-guard).
      - run: bun run build
        env:
          TRACKDOWN_DATA_DIR: fixtures/trackdown-data
      - name: Guard the static output
        run: bun run build:guard fixtures/trackdown-data
      # The Node server, for the Browser checks job, so the site is built
      # once per run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nitro-output
          path: .output
          include-hidden-files: true
          retention-days: 1

  # axe on every page, a game played with the keyboard alone and Lighthouse's
  # budgets on the game page, against the Build job's server
  # (docs/accessibility.md#in-ci).
  browser-checks:
    name: Browser checks
    needs: [install, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bun binary only; dependencies come from the cache below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # The server runs on Node, as on Vercel, and loads the TypeScript clock
      # shift (e2e/shift-server-clock.ts) without a build step.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nitro-output
          path: .output
      # Playwright's Chromium, cached per Playwright version. The system
      # libraries it needs come from apt on every run, cache hit or not.
      - id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run test:browser
      # Runs even when a Playwright check failed, so one run reports both.
      # Lighthouse uses the runner's own Google Chrome.
      - if: ${{ !cancelled() }}
        run: bun run lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks
          path: |
            test-results
            .lighthouseci/reports
          include-hidden-files: true
          if-no-files-found: ignore
